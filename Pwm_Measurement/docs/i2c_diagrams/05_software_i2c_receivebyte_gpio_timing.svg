<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="软件 I2C ReceiveByte GPIO 电平时序和当前代码问题">
<style><![CDATA[

    svg {
      --navy: #0b2d75;
      --blue: #1b5fc9;
      --green: #087a4a;
      --green2: #0b8f5a;
      --line: #9bb2d9;
      --pale: #f6f9ff;
      --pale-green: #eefaf2;
      --pale-red: #fff2f2;
      --red: #d12b2b;
      --orange: #ce7a08;
      --ink: #17213b;
      --muted: #51617d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #dfe7f5;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    .deck {
      width: 1600px;
      margin: 0 auto;
      padding: 18px 0 36px;
    }

    .page {
      width: 1600px;
      height: 900px;
      margin: 0 0 28px;
      background: #fff;
      border: 1px solid #b8c8e7;
      box-shadow: 0 8px 28px rgba(11, 45, 117, .18);
      overflow: hidden;
      position: relative;
    }

    .page svg {
      display: block;
      width: 1600px;
      height: 900px;
    }

    .title {
      font-size: 34px;
      font-weight: 800;
      fill: #fff;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 600;
      fill: #dce8ff;
    }

    .label {
      font-size: 18px;
      fill: var(--ink);
    }

    .small {
      font-size: 15px;
      fill: var(--muted);
    }

    .tiny {
      font-size: 13px;
      fill: var(--muted);
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      fill: #fff;
    }

    .box-title {
      font-size: 20px;
      font-weight: 800;
      fill: var(--navy);
    }

    .mono {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 16px;
      fill: var(--ink);
    }

    .mono-small {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
      fill: var(--ink);
    }

    .step-num {
      font-size: 16px;
      font-weight: 800;
      fill: #fff;
    }

    .flag {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 17px;
      font-weight: 800;
      fill: var(--blue);
    }

    .warn {
      fill: var(--red);
      font-weight: 800;
    }

    .ok {
      fill: var(--green);
      font-weight: 800;
    }
  
]]></style>
        <rect x="0" y="0" width="1600" height="900" fill="#f6f9ff"/>
        <rect x="0" y="0" width="1600" height="72" fill="#0b2d75"/>
        <text x="800" y="45" text-anchor="middle" class="title">软件 I2C 图 2：GPIO 电平时序 - ReceiveByte() + 当前代码参数</text>
        <text x="800" y="66" text-anchor="middle" class="subtitle">重点标 scl_w(0/1)、sda_w(1) 释放、sda_r 采样、Ack 参数和第 9 个应答时钟</text>

        <rect x="26" y="96" width="590" height="260" rx="8" fill="#ffffff" stroke="#9bb2d9"/>
        <rect x="48" y="118" width="300" height="38" rx="6" fill="#087a4a"/>
        <text x="68" y="144" class="card-title">ReceiveByte() 代码顺序</text>
        <text x="58" y="196" class="mono">for i = 7..0:</text>
        <text x="92" y="232" class="mono">scl_w(0); sda_w(1); delay(2);</text>
        <text x="92" y="268" class="mono">scl_w(1); delay(2); if(sda_r) ret |= ...;</text>
        <text x="58" y="318" class="mono">scl_w(0); Ack ? sda_w(0) : sda_w(1); delay(2); return ret;</text>

        <rect x="646" y="96" width="888" height="260" rx="8" fill="#fff2f2" stroke="#d12b2b"/>
        <rect x="668" y="118" width="300" height="38" rx="6" fill="#d12b2b"/>
        <text x="688" y="144" class="card-title">当前代码要特别标出来</text>
        <text x="678" y="198" class="label">你当前代码参数：<tspan class="warn">Ack=1 -> 发送 ACK</tspan>，<tspan class="warn">Ack=0 -> 发送 NACK</tspan></text>
        <text x="678" y="238" class="label">当前调用：<tspan class="mono">ReceiveByte(SI2C, (i==Size-1) ? 1 : 0)</tspan></text>
        <text x="678" y="278" class="label warn">这会导致：中间字节发 NACK，最后字节发 ACK，方向反了。</text>
        <text x="678" y="318" class="label warn">当前 ReceiveByte() 设置 ACK/NACK 后没有拉高 SCL 形成完整第 9 个应答脉冲。</text>

        <rect x="26" y="384" width="1534" height="328" rx="8" fill="#ffffff" stroke="#9bb2d9"/>
        <rect x="48" y="406" width="470" height="38" rx="6" fill="#087a4a"/>
        <text x="68" y="432" class="card-title">ReceiveByte(示例数据 0x5A = 0101 1010)：从机输出 8 位，主机采样后回 ACK/NACK</text>

        <g transform="translate(110 492)">
          <text x="-62" y="28" class="box-title">SCL</text>
          <text x="-62" y="108" class="box-title">SDA</text>
          <line x1="0" y1="40" x2="1320" y2="40" stroke="#d8e1f2"/>
          <line x1="0" y1="120" x2="1320" y2="120" stroke="#d8e1f2"/>
          <polyline points="0,70 30,70 30,20 80,20 80,70 120,70 120,20 170,20 170,70 210,70 210,20 260,20 260,70 300,70 300,20 350,20 350,70 390,70 390,20 440,20 440,70 480,70 480,20 530,20 530,70 570,70 570,20 620,20 620,70 660,70 660,20 710,20 710,70 760,70 760,20 810,20 810,70 880,70" fill="none" stroke="#087a4a" stroke-width="4"/>
          <polyline points="0,145 30,145 30,145 80,145 80,100 120,100 120,100 170,100 170,145 210,145 210,145 260,145 260,100 300,100 300,100 350,100 350,100 390,100 390,145 440,145 440,145 480,145 480,100 530,100 530,100 570,100 570,145 620,145 620,145 660,145 660,100 710,100 710,100 760,100 760,145 810,145 810,145 880,145" fill="none" stroke="#1b5fc9" stroke-width="4"/>
          <line x1="920" y1="-12" x2="920" y2="190" stroke="#d12b2b" stroke-width="2" stroke-dasharray="8 6"/>
          <line x1="1010" y1="-12" x2="1010" y2="190" stroke="#d12b2b" stroke-width="2" stroke-dasharray="8 6"/>
          <polyline points="880,70 920,70 920,70 1010,70 1010,70 1070,70" fill="none" stroke="#087a4a" stroke-width="4" stroke-dasharray="10 6"/>
          <polyline points="880,145 920,145 920,145 1010,145 1010,145 1070,145" fill="none" stroke="#d12b2b" stroke-width="4" stroke-dasharray="10 6"/>
          <text x="965" y="0" text-anchor="middle" class="box-title warn">第 9 位应答</text>
          <text x="965" y="178" text-anchor="middle" class="label warn">协议要求这里也要有 SCL 高脉冲</text>
          <g class="small" text-anchor="middle">
            <text x="55" y="0">D7</text><text x="55" y="178">0</text>
            <text x="145" y="0">D6</text><text x="145" y="178">1</text>
            <text x="235" y="0">D5</text><text x="235" y="178">0</text>
            <text x="325" y="0">D4</text><text x="325" y="178">1</text>
            <text x="415" y="0">D3</text><text x="415" y="178">1</text>
            <text x="505" y="0">D2</text><text x="505" y="178">0</text>
            <text x="595" y="0">D1</text><text x="595" y="178">1</text>
            <text x="705" y="0">D0</text><text x="705" y="178">0</text>
          </g>
        </g>

        <rect x="26" y="740" width="720" height="110" rx="8" fill="#ffffff" stroke="#9bb2d9"/>
        <rect x="48" y="762" width="250" height="34" rx="6" fill="#0b8f5a"/>
        <text x="68" y="786" class="card-title">图上统一写法</text>
        <text x="58" y="830" class="label">协议电平：<tspan class="warn">SDA=0 -> ACK</tspan>，<tspan class="warn">SDA=1 -> NACK</tspan></text>

        <rect x="780" y="740" width="780" height="110" rx="8" fill="#fff8ec" stroke="#ce7a08"/>
        <rect x="802" y="762" width="280" height="34" rx="6" fill="#ce7a08"/>
        <text x="822" y="786" class="card-title">建议把流程图按这个方向画</text>
        <text x="812" y="830" class="label">前 N-1 字节：Ack=1 发送 ACK；最后 1 字节：Ack=0 发送 NACK，然后 STOP。</text>
      </svg>
